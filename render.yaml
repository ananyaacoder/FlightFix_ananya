services:
  - type: web
    name: flightfix-mro
    runtime: python
    buildCommand: pip install -r Backend/requirements.txt && python Backend/manage.py migrate
    startCommand: gunicorn --chdir Backend flightfix_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
