<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlightFix — Orbital Fleet MRO Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="not-logged-in">

  <!-- Accessible Skip Navigation Link for Keyboard & Screen Readers (WCAG 2.4.1) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- TOP NAVIGATION BAR -->
  <header role="banner">
    <div class="logo">
      <div class="logo-icon">
        <svg role="img" aria-label="FlightFix Aircraft Logo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      </div>
      <div>
        <div class="logo-title">FLIGHT<span>FIX</span></div>
      </div>
    </div>

    <!-- Active User & Role Display -->
    <div class="session-badge-container" role="status" aria-live="polite" style="display: none;">
      <span id="nav-user-name"></span>
      <span id="nav-role-badge" class="role-badge"></span>
    </div>

    <!-- Main Navigation Bar -->
    <nav id="nav" role="navigation" aria-label="Main Navigation">
      <button id="nav-home" onclick="showView('home')" aria-label="Home and radar overview">Home</button>

      <button id="nav-dash" class="nav-auth-only" onclick="showView('dash')" style="display: none;" aria-label="Operations and task dashboard">Dashboard</button>
      <button id="nav-plan" class="nav-auth-only nav-admin-only" onclick="showView('plan')" style="display: none;" aria-label="Hangar planning and schedule">Plan</button>
      <button id="nav-inv" class="nav-auth-only nav-admin-only" onclick="showView('inv')" style="display: none;" aria-label="Spare parts inventory">Inventory</button>
      <button id="nav-erp" class="nav-auth-only nav-admin-only" onclick="showView('erp')" style="display: none;" aria-label="Enterprise procurement and orders">ERP</button>
      <button id="nav-tech" class="nav-auth-only nav-admin-only" onclick="showView('tech')" style="display: none;" aria-label="Technician workbench portal">Tech</button>

      <button id="nav-login-btn" class="btn-auth-nav" onclick="showView('login')" aria-label="Sign in or register account">Login / Sign Up</button>
      <button id="nav-logout-btn" class="btn-logout-nav" onclick="logoutUser()" style="display: none;" aria-label="Sign out of current account">Logout</button>

      <button id="nav-reset" class="btn red nav-auth-only nav-admin-only" onclick="resetAll()" style="display: none;" aria-label="Reset demo dataset">Reset demo data</button>
    </nav>
  </header>

  <!-- MAIN ACCESSIBLE LANDMARK & VIEW CONTAINERS -->
  <main id="main-content" role="main" tabindex="-1">
    <section id="home" class="view on" aria-label="Fleet Radar & Overview"></section>

    <section id="dash" class="view" style="display: none;" aria-label="Operations Matrix & Tasks"></section>
    <section id="plan" class="view" style="display: none;" aria-label="Hangar Bay Maintenance Schedule"></section>
    <section id="inv" class="view" style="display: none;" aria-label="Spares & Parts Inventory Catalog"></section>
    <section id="erp" class="view" style="display: none;" aria-label="Procurement & Purchase Orders"></section>
    <section id="tech" class="view" style="display: none;" aria-label="Technician Workbench"></section>

    <!-- AUTH / PRIVATE DUAL-ROLE REGISTRATION & LOGIN VIEW -->
    <section id="login" class="view" style="display: none;" aria-label="Authentication Portal">
      <div class="auth-container">
        <div class="auth-tabs" role="tablist" aria-label="Authentication Options">
          <button id="tab-login" class="auth-tab-btn active" role="tab" aria-selected="true" aria-controls="form-login-block" onclick="switchAuthTab('login')">Sign In</button>
          <button id="tab-register" class="auth-tab-btn" role="tab" aria-selected="false" aria-controls="form-register-block" onclick="switchAuthTab('register')">Register New Account</button>
        </div>

        <div id="form-login-block" role="tabpanel" aria-labelledby="tab-login">
          <form onsubmit="handleFormLogin(event)">
            <div class="auth-form-group">
              <label for="login-email">Official Work Email or Employee ID</label>
              <input type="text" id="login-email" placeholder="Enter your registered email address" required aria-required="true" autocomplete="username">
            </div>
            <div class="auth-form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" placeholder="Enter your password" required aria-required="true" autocomplete="current-password">
            </div>
            <button type="submit" class="auth-submit-btn">Sign In to Private Portal</button>
          </form>
        </div>

        <div id="form-register-block" role="tabpanel" aria-labelledby="tab-register" style="display: none;">
          <form onsubmit="handleFormRegister(event)">
            <div class="auth-form-group">
              <label for="reg-name">Full Name</label>
              <input type="text" id="reg-name" placeholder="Enter your full name" required aria-required="true" autocomplete="name">
            </div>
            <div class="auth-form-group">
              <label for="reg-email">Official Work Email</label>
              <input type="email" id="reg-email" placeholder="Enter your work email address" required aria-required="true" autocomplete="email">
            </div>
            <div class="auth-form-group">
              <label for="reg-empid">Employee / License ID</label>
              <input type="text" id="reg-empid" placeholder="e.g. EMP-501 or AME-3049" required aria-required="true">
            </div>

            <div class="auth-form-group">
              <label for="reg-role">Account Type & Dashboard Access:</label>
              <select id="reg-role" required aria-required="true">
                <option value="user" selected>Field Technician / AME (Maintenance Workbench Only)</option>
                <option value="admin">Company Admin (Fleet Management, Approvals, ERP Only)</option>
              </select>
            </div>

            <div class="auth-form-group">
              <label for="reg-station">Assigned Station / Hub</label>
              <input type="text" id="reg-station" placeholder="e.g. JFK, LHR, DXB, or SIN" required aria-required="true">
            </div>
            <div class="auth-form-group">
              <label for="reg-password">Create Password</label>
              <input type="password" id="reg-password" placeholder="Create a secure password" required aria-required="true" autocomplete="new-password">
            </div>
            <button type="submit" class="auth-submit-btn register-btn">Create Private Account & Launch</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Core Scripts -->
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>

  <!-- View Scripts -->
  <script src="js/views/home.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/workorders.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/erp.js"></script>
  <script src="js/views/technician.js"></script>
  <script src="js/views/login.js"></script>

  <!-- Main Controller -->
  <script src="js/app.js"></script>

  <!-- Notification Toast Container with Accessibility Live Region -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

</body>
</html>
